<section class="payment-page">
  <article class="payment-card">
    <div class="payment-layout">
      <div class="payment-form-block">
        <div class="section-head">
          <h2>Nouveau paiement</h2>
          <p>Enregistrez rapidement un paiement restaurant depuis votre espace.</p>
        </div>

        <div class="payment-grid">
          <label class="field">
            <span>Nom du client</span>
            <input [(ngModel)]="customer" type="text" placeholder="Ex : Sophie Martin" />
          </label>

          <label class="field">
            <span>Numero de table</span>
            <input [(ngModel)]="tableNumber" type="text" placeholder="Ex : Table 4" />
          </label>

          <label class="field field-full">
            <span>Montant</span>
            <input [(ngModel)]="amount" type="text" placeholder="Ex : 14 500 FCFA" />
          </label>
        </div>

        <div class="quick-amounts">
          <span>Montants rapides</span>
          <div class="quick-amount-list">
            <button *ngFor="let quickAmount of quickAmounts" type="button" (click)="amount = quickAmount + ' FCFA'">
              {{ quickAmount }} FCFA
            </button>
          </div>
        </div>

        <div class="payment-actions">
          <button type="button" class="secondary-btn">Scanner un QR code</button>
          <button type="button" class="primary-btn">Valider le paiement</button>
        </div>
      </div>

      <aside class="payment-qr-block" aria-label="Code QR du restaurant">
        <div class="payment-qr-frame">
          <svg viewBox="0 0 210 210" class="payment-qr-code" role="img" aria-label="Code QR">
            <rect width="210" height="210" fill="#fff"></rect>
            <rect x="0" y="0" width="42" height="42" fill="#000"></rect>
            <rect x="7" y="7" width="28" height="28" fill="#fff"></rect>
            <rect x="14" y="14" width="14" height="14" fill="#000"></rect>
            <rect x="168" y="0" width="42" height="42" fill="#000"></rect>
            <rect x="175" y="7" width="28" height="28" fill="#fff"></rect>
            <rect x="182" y="14" width="14" height="14" fill="#000"></rect>
            <rect x="0" y="168" width="42" height="42" fill="#000"></rect>
            <rect x="7" y="175" width="28" height="28" fill="#fff"></rect>
            <rect x="14" y="182" width="14" height="14" fill="#000"></rect>
            <rect x="56" y="0" width="14" height="14" fill="#000"></rect>
            <rect x="70" y="14" width="14" height="14" fill="#000"></rect>
            <rect x="84" y="0" width="14" height="14" fill="#000"></rect>
            <rect x="98" y="14" width="14" height="14" fill="#000"></rect>
            <rect x="56" y="42" width="14" height="14" fill="#000"></rect>
            <rect x="70" y="56" width="14" height="14" fill="#000"></rect>
            <rect x="84" y="42" width="14" height="14" fill="#000"></rect>
            <rect x="98" y="56" width="14" height="14" fill="#000"></rect>
            <rect x="42" y="70" width="14" height="14" fill="#000"></rect>
            <rect x="56" y="84" width="14" height="14" fill="#000"></rect>
            <rect x="70" y="70" width="14" height="14" fill="#000"></rect>
            <rect x="84" y="84" width="14" height="14" fill="#000"></rect>
            <rect x="98" y="70" width="14" height="14" fill="#000"></rect>
            <rect x="126" y="56" width="14" height="14" fill="#000"></rect>
            <rect x="140" y="70" width="14" height="14" fill="#000"></rect>
            <rect x="154" y="56" width="14" height="14" fill="#000"></rect>
            <rect x="168" y="70" width="14" height="14" fill="#000"></rect>
            <rect x="112" y="84" width="14" height="14" fill="#000"></rect>
            <rect x="126" y="98" width="14" height="14" fill="#000"></rect>
            <rect x="140" y="84" width="14" height="14" fill="#000"></rect>
            <rect x="154" y="98" width="14" height="14" fill="#000"></rect>
            <rect x="42" y="112" width="14" height="14" fill="#000"></rect>
            <rect x="70" y="112" width="14" height="14" fill="#000"></rect>
            <rect x="84" y="126" width="14" height="14" fill="#000"></rect>
            <rect x="98" y="112" width="14" height="14" fill="#000"></rect>
            <rect x="126" y="112" width="14" height="14" fill="#000"></rect>

          </svg>
        </div>
      </aside>
    </div>
  </article>
</section>
