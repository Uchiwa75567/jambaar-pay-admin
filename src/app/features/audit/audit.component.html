<div class="page-header">
  <h2>Journal d'Audit</h2>
  <p>Historique des actions administratives</p>
</div>

<div class="card">
  <p-table [value]="logs" [paginator]="true" [rows]="10">
    <ng-template pTemplate="header">
      <tr>
        <th>ID</th>
        <th>Utilisateur</th>
        <th>Action</th>
        <th>Cible</th>
        <th>Date</th>
        <th>Adresse IP</th>
      </tr>
    </ng-template>
    <ng-template pTemplate="body" let-log>
      <tr>
        <td><code>{{ log.id }}</code></td>
        <td>{{ log.user }}</td>
        <td><span class="action-tag">{{ log.action }}</span></td>
        <td>{{ log.target }}</td>
        <td>{{ log.date | dateFr }}</td>
        <td><code>{{ log.ip }}</code></td>
      </tr>
    </ng-template>
  </p-table>
</div>
