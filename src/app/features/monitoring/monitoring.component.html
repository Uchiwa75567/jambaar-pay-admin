<!-- KPI Cards -->
<div class="kpi-grid">
  <app-kpi-card
    *ngFor="let kpi of kpis"
    [label]="kpi.label"
    [value]="kpi.value"
    [change]="kpi.change ?? 0"
    [changeLabel]="kpi.changeLabel ?? ''"
    [iconSrc]="kpi.iconSrc">
  </app-kpi-card>
</div>

<!-- Transactions table card -->
<div class="panel table-panel">
  <div class="panel-toolbar">
    <h3 class="panel-title">Toutes les transactions</h3>

    <div class="toolbar-right">
      <div class="table-search">
        <i class="pi pi-search"></i>
        <input pInputText type="text" placeholder="Rechercher une transaction, une entreprise ou un restaurant"
          [ngModel]="searchTerm()" (ngModelChange)="onSearchChange($event)" />
      </div>

      <!-- Filter dropdown -->
      <div class="dropdown-wrap">
        <button class="filter-btn" type="button" (click)="toggleFilterMenu()">
          <i class="pi pi-filter"></i>
          <span>{{ statusFilter() }}</span>
        </button>
        <div class="filter-menu" *ngIf="filterMenuOpen()">
          <button *ngFor="let f of filterOptions" class="filter-item"
            [class.active]="statusFilter() === f"
            type="button" (click)="setFilter(f)">{{ f }}</button>
        </div>
      </div>

      <!-- Export dropdown -->
      <div class="export-wrapper">
        <input #monitoringImportInput class="file-input" type="file" accept=".csv,.json" (change)="onImportFileSelected($event)" />
        <button class="btn-import" type="button" (click)="monitoringImportInput.click()">Importer</button>
        <button class="btn-export" type="button" (click)="toggleExportMenu()">Exporter</button>
        <div class="export-menu" *ngIf="exportMenuOpen()">
          <button class="export-item" type="button" (click)="exportPDF()">
            <img src="assets/icons/icon-pdf.svg" alt="PDF" class="export-icon" />
            <span>Exporter PDF</span>
          </button>
          <button class="export-item" type="button" (click)="exportExcel()">
            <img src="assets/icons/icon-excel.svg" alt="Excel" class="export-icon" />
            <span>Exporter Excel</span>
          </button>
        </div>
      </div>
    </div>
  </div>

  <p class="feedback-message" *ngIf="feedback() as state" [class.is-error]="state.type === 'error'">
    {{ state.message }}
  </p>

  <p-table [value]="transactions()" styleClass="monitoring-table">
    <ng-template pTemplate="header">
      <tr>
        <th>ID</th>
        <th>Salariés</th>
        <th>Entreprise</th>
        <th>Restaurant</th>
        <th>Montant</th>
        <th>Date</th>
        <th>Statut</th>
      </tr>
    </ng-template>
    <ng-template pTemplate="body" let-tx>
      <tr>
        <td class="txn-id" data-label="ID">{{ tx.id }}</td>
        <td data-label="Salarié">{{ tx.employee }}</td>
        <td data-label="Entreprise">{{ tx.company }}</td>
        <td data-label="Restaurant">{{ tx.restaurant }}</td>
        <td data-label="Montant">{{ tx.amount }} Fcfa</td>
        <td data-label="Date">{{ tx.date }}</td>
        <td data-label="Statut"><app-status-badge [status]="tx.status"></app-status-badge></td>
      </tr>
    </ng-template>
    <ng-template pTemplate="emptymessage">
      <tr><td colspan="7" class="empty-message">Aucune transaction trouvée.</td></tr>
    </ng-template>
  </p-table>

  <div class="table-footer">
    <div class="dropdown-wrap">
      <button class="rows-btn" type="button" (click)="togglePageSizeMenu()">
        <span>lignes par page</span>
        <strong>{{ pageSize() }}</strong>
        <i class="pi pi-chevron-down" style="font-size:11px"></i>
      </button>
      <div class="rows-menu" *ngIf="pageSizeMenuOpen()">
        <button *ngFor="let s of pageSizeOptions" class="rows-item"
          [class.active]="pageSize() === s"
          type="button" (click)="setPageSize(s)">{{ s }}</button>
      </div>
    </div>

    <nav class="pagination" aria-label="Pagination">
      <span class="prev" [class.disabled]="currentPage() === 1" (click)="prevPage()">Prec</span>
      <ng-container *ngFor="let p of visiblePages()">
        <span *ngIf="p !== '...'" class="page"
          [class.active]="currentPage() === p"
          [class.outlined]="currentPage() !== p"
          (click)="setPage(p)">{{ p < 10 ? '0' + p : p }}</span>
        <span *ngIf="p === '...'" class="dots">...</span>
      </ng-container>
      <span class="next" [class.disabled]="currentPage() === totalPages()" (click)="nextPage()">Suiv</span>
    </nav>
  </div>
</div>
