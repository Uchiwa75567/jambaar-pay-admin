<header class="topbar">
  <div class="title-block">
    <h1 class="page-title">{{ pageTitle }}</h1>
    <p class="page-subtitle" *ngIf="pageSubtitle">{{ pageSubtitle }}</p>
  </div>

  <div class="search-box">
    <img src="assets/icons/icon-search.svg" alt="" class="search-icon" aria-hidden="true" />
    <input type="text" placeholder="Recherchez ..." aria-label="Rechercher dans l'application" />
  </div>

  <div class="topbar-right">
    <a
      *ngIf="showSettingsLink"
      routerLink="/settings"
      routerLinkActive="settings-active"
      class="icon-btn"
      aria-label="Paramètres du système">
      <img src="assets/icons/icon-settings.svg" alt="" class="settings-icon" aria-hidden="true" />
    </a>

    <button
      *ngIf="isEnterprise"
      type="button"
      class="icon-btn icon-btn-disabled"
      aria-label="Paramètres non disponibles"
      aria-disabled="true">
      <img src="assets/icons/icon-settings.svg" alt="" class="settings-icon" aria-hidden="true" />
    </button>

    <button
      *ngIf="isRestaurant"
      type="button"
      class="icon-btn notification-btn"
      aria-label="Notifications du restaurant">
      <i class="pi pi-bell icon-glyph" aria-hidden="true"></i>
    </button>

    <button
      type="button"
      class="icon-btn mobile-logout-btn"
      aria-label="Se déconnecter"
      (click)="logout()">
      <img src="assets/icons/icon-logout.svg" alt="" class="logout-icon" aria-hidden="true" />
    </button>

    <div class="avatar-block">
      <div class="user-info">
        <span class="user-name">{{ profile?.name ?? 'Admin' }}</span>
        <span class="user-role">{{ profile?.role }}</span>
      </div>
      <img
        src="assets/images/avatar-admin.png"
        [alt]="profile?.name ?? 'Admin'"
        class="avatar-photo"
      />
    </div>
  </div>
</header>
