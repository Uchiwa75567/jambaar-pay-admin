<div class="panel audit-panel">
  <div class="panel-toolbar">
    <h3 class="panel-title">Journal d'audit</h3>

    <div class="toolbar-right">
      <div class="table-search">
        <i class="pi pi-search"></i>
        <input pInputText type="text" placeholder="Rechercher dans l'audit"
          [ngModel]="searchTerm()" (ngModelChange)="searchTerm.set($event)" />
      </div>

      <!-- Filter dropdown -->
      <div class="dropdown-wrap">
        <button class="filter-btn" type="button" (click)="toggleFilterMenu()">
          <i class="pi pi-filter"></i>
          <span>{{ actionFilter() }}</span>
        </button>
        <div class="filter-menu" *ngIf="filterMenuOpen()">
          <button *ngFor="let f of filterOptions" class="filter-item"
            [class.active]="actionFilter() === f"
            type="button" (click)="setFilter(f)">{{ f }}</button>
        </div>
      </div>

      <!-- Export dropdown -->
      <div class="export-wrapper">
        <button class="btn-export" type="button" (click)="toggleExportMenu()">Exporter</button>
        <div class="export-menu" *ngIf="exportMenuOpen()">
          <button class="export-item" type="button" (click)="exportPDF()">
            <img src="assets/icons/icon-pdf.svg" alt="PDF" class="export-icon" />
            <span>Exporter PDF</span>
          </button>
          <button class="export-item" type="button" (click)="exportExcel()">
            <img src="assets/icons/icon-excel.svg" alt="Excel" class="export-icon" />
            <span>Exporter Excel</span>
          </button>
        </div>
      </div>
    </div>
  </div>

  <p-table [value]="logs()" styleClass="audit-table">
    <ng-template pTemplate="header">
      <tr>
        <th>Action</th>
        <th>Utilisateurs</th>
        <th>details</th>
        <th>Date</th>
      </tr>
    </ng-template>
    <ng-template pTemplate="body" let-log>
      <tr>
        <td data-label="Action">{{ log.action }}</td>
        <td data-label="Utilisateur">{{ log.user }}</td>
        <td data-label="Détails">{{ log.details }}</td>
        <td data-label="Date">{{ log.date }}</td>
      </tr>
    </ng-template>
    <ng-template pTemplate="emptymessage">
      <tr><td colspan="4" class="empty-message">Aucun journal trouvé.</td></tr>
    </ng-template>
  </p-table>

  <div class="table-footer">
    <div class="dropdown-wrap">
      <button class="rows-btn" type="button" (click)="togglePageSizeMenu()">
        <span>lignes par page</span>
        <strong>{{ pageSize() }}</strong>
        <i class="pi pi-chevron-down" style="font-size:11px"></i>
      </button>
      <div class="rows-menu" *ngIf="pageSizeMenuOpen()">
        <button *ngFor="let s of pageSizeOptions" class="rows-item"
          [class.active]="pageSize() === s"
          type="button" (click)="setPageSize(s)">{{ s }}</button>
      </div>
    </div>

    <nav class="pagination" aria-label="Pagination">
      <span class="prev" [class.disabled]="currentPage() === 1" (click)="prevPage()">Prec</span>
      <ng-container *ngFor="let p of visiblePages()">
        <span *ngIf="p !== '...'" class="page"
          [class.active]="currentPage() === p"
          [class.outlined]="currentPage() !== p"
          (click)="setPage(p)">{{ p < 10 ? '0' + p : p }}</span>
        <span *ngIf="p === '...'" class="dots">...</span>
      </ng-container>
      <span class="next" [class.disabled]="currentPage() === totalPages()" (click)="nextPage()">Suiv</span>
    </nav>
  </div>
</div>
