<section class="restaurants-card">
  <div class="restaurants-toolbar">
    <h2>Liste des restaurants</h2>

    <div class="toolbar-actions">
      <div class="table-search">
        <i class="pi pi-search"></i>
        <input pInputText type="text" placeholder="Rechercher un restaurant"
          [ngModel]="searchTerm()" (ngModelChange)="onSearchChange($event)" />
      </div>

      <!-- Filter dropdown -->
      <div class="dropdown-wrap">
        <button class="filter-btn" type="button" (click)="toggleFilterMenu()">
          <i class="pi pi-filter"></i>
          <span>{{ statusFilter() }}</span>
        </button>
        <div class="filter-menu" *ngIf="filterMenuOpen()">
          <button *ngFor="let f of filterOptions" class="filter-item"
            [class.active]="statusFilter() === f"
            type="button" (click)="setFilter(f)">{{ f }}</button>
        </div>
      </div>

      <input #restaurantImportInput class="file-input" type="file" accept=".csv,.json" (change)="onImportFileSelected($event)" />
      <button class="btn-secondary" type="button" (click)="restaurantImportInput.click()">Importer</button>

      <div class="export-wrapper">
        <button class="btn-secondary" type="button" (click)="toggleExportMenu()">Exporter</button>
        <div class="export-menu" *ngIf="exportMenuOpen()">
          <button class="export-item" type="button" (click)="exportExcel()">Exporter Excel</button>
          <button class="export-item" type="button" (click)="exportPdf()">Exporter PDF</button>
        </div>
      </div>

      <button class="btn-add" type="button" routerLink="/restaurants/add">Ajouter un restaurant</button>
    </div>
  </div>

  <p class="feedback-message" *ngIf="feedback() as state" [class.is-error]="state.type === 'error'">
    {{ state.message }}
  </p>

  <p-table [value]="restaurants()" styleClass="restaurants-table">
    <ng-template pTemplate="header">
      <tr>
        <th>Restaurants</th>
        <th>Localisation</th>
        <th>Transactions</th>
        <th>Statut</th>
        <th>Action</th>
      </tr>
    </ng-template>
    <ng-template pTemplate="body" let-restaurant>
      <tr>
        <td data-label="Restaurant">{{ restaurant.name }}</td>
        <td data-label="Localisation">{{ restaurant.address }}</td>
        <td data-label="Transactions">{{ restaurant.totalTransactions }}</td>
        <td data-label="Statut"><app-status-badge [status]="restaurant.status"></app-status-badge></td>
        <td data-label="Action">
          <button class="action-btn" (click)="actionMenu.toggle($event)" aria-label="Actions restaurant">
            <i class="pi pi-ellipsis-v"></i>
          </button>
          <p-menu #actionMenu [popup]="true" [model]="getMenuItems()" appendTo="body" styleClass="row-action-menu"></p-menu>
        </td>
      </tr>
    </ng-template>
    <ng-template pTemplate="emptymessage">
      <tr><td colspan="5" class="empty-message">Aucun restaurant trouvé.</td></tr>
    </ng-template>
  </p-table>

  <div class="table-footer">
    <div class="dropdown-wrap">
      <button class="rows-btn" type="button" (click)="togglePageSizeMenu()">
        <span>lignes par page</span>
        <strong>{{ pageSize() }}</strong>
        <i class="pi pi-chevron-down" style="font-size:11px"></i>
      </button>
      <div class="rows-menu" *ngIf="pageSizeMenuOpen()">
        <button *ngFor="let s of pageSizeOptions" class="rows-item"
          [class.active]="pageSize() === s"
          type="button" (click)="setPageSize(s)">{{ s }}</button>
      </div>
    </div>

    <nav class="pagination" aria-label="Pagination">
      <span class="prev" [class.disabled]="currentPage() === 1" (click)="prevPage()">Prec</span>
      <ng-container *ngFor="let p of visiblePages()">
        <span *ngIf="p !== '...'" class="page"
          [class.active]="currentPage() === p"
          [class.outlined]="currentPage() !== p"
          (click)="setPage(p)">{{ p < 10 ? '0' + p : p }}</span>
        <span *ngIf="p === '...'" class="dots">...</span>
      </ng-container>
      <span class="next" [class.disabled]="currentPage() === totalPages()" (click)="nextPage()">Suiv</span>
    </nav>
  </div>
</section>
