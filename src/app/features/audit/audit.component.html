<div class="panel audit-panel">
  <div class="panel-toolbar">
    <h3 class="panel-title">Journal d'audit</h3>

    <div class="toolbar-right">
      <div class="table-search">
        <i class="pi pi-search"></i>
        <input pInputText type="text" placeholder="Rechercher dans l'audit"
          [ngModel]="searchTerm()" (ngModelChange)="onSearchChange($event)" />
      </div>

      <!-- Filter dropdown -->
      <div class="dropdown-wrap">
        <button class="filter-btn" type="button" (click)="toggleFilterMenu()">
          <i class="pi pi-filter"></i>
          <span>{{ actionFilter() }}</span>
        </button>
        @if (filterMenuOpen()) {
          <div class="filter-menu">
            @for (f of filterOptions; track f) {
              <button class="filter-item"
                [class.active]="actionFilter() === f"
              type="button" (click)="setFilter(f)">{{ f }}</button>
            }
          </div>
        }
      </div>

      <!-- Export dropdown -->
      <div class="export-wrapper">
        <button class="btn-export" type="button" (click)="toggleExportMenu()">Exporter</button>
        @if (exportMenuOpen()) {
          <div class="export-menu">
            <button class="export-item" type="button" (click)="exportPDF()">
              <img src="assets/icons/icon-pdf.svg" alt="PDF" class="export-icon" />
              <span>Exporter PDF</span>
            </button>
            <button class="export-item" type="button" (click)="exportExcel()">
              <img src="assets/icons/icon-excel.svg" alt="Excel" class="export-icon" />
              <span>Exporter Excel</span>
            </button>
          </div>
        }
      </div>
    </div>
  </div>

  <app-feedback-message [state]="feedback()" />

  <p-table [value]="logs()" styleClass="audit-table">
    <ng-template pTemplate="header">
      <tr>
        <th>Action</th>
        <th>Utilisateurs</th>
        <th>details</th>
        <th>Date</th>
      </tr>
    </ng-template>
    <ng-template pTemplate="body" let-log>
      <tr>
        <td data-label="Action">{{ log.action }}</td>
        <td data-label="Utilisateur">{{ log.user }}</td>
        <td data-label="Détails">{{ log.details }}</td>
        <td data-label="Date">{{ log.date }}</td>
      </tr>
    </ng-template>
    <ng-template pTemplate="emptymessage">
      <tr>
        <td colspan="4" class="empty-message">
          @if (loading()) {
            <app-loading-state message="Chargement du journal…" />
          } @else {
            <app-empty-state message="Aucun journal trouvé." />
          }
        </td>
      </tr>
    </ng-template>
  </p-table>

  <app-pagination
    [currentPage]="currentPage()"
    [totalPages]="totalPages()"
    [pageSize]="pageSize()"
    [pageSizeOptions]="pageSizeOptions"
    ariaLabel="Pagination du journal d'audit"
    (pageChange)="setPage($event)"
    (pageSizeChange)="setPageSize($event)" />
</div>
