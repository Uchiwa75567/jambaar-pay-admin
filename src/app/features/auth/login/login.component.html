<div class="login-card">
  <aside class="login-left">
    <div class="left-overlay"></div>
    <div class="left-content">
      <div class="brand-label">JAMBAAR-PAY</div>

      <div class="brand-logo">
        <img src="/assets/images/jambaar-pay-logo.png" alt="Jambaar Pay logo" />
      </div>

      <div class="brand-title">JAMBAAR PAY</div>
    </div>
  </aside>

  <main class="login-right">
    <div class="login-form-card">
      <div class="login-header">
        <h1>BIENVENUE</h1>
        <p>Connectez-vous sur votre espace Jambaar Pay</p>
      </div>

      <div *ngIf="error()" class="error-alert">
        <i class="pi pi-exclamation-circle"></i>
        <span>{{ error() }}</span>
      </div>

      <form (ngSubmit)="onSubmit()" #f="ngForm" class="login-form">
        <div class="field">
          <label for="email">Adresse email</label>
          <div class="input-wrapper">
            <i class="pi pi-envelope input-icon"></i>
            <input
              pInputText
              id="email"
              type="email"
              [(ngModel)]="form.email"
              name="email"
              placeholder="Adresseemail@gmail.com"
              class="w-full" />
          </div>
        </div>

        <div class="field">
          <label for="password">Mot de passe</label>
          <div class="input-wrapper">
            <i class="pi pi-lock input-icon"></i>
            <input
              pInputText
              id="password"
              [type]="showPassword() ? 'text' : 'password'"
              [(ngModel)]="form.password"
              name="password"
              placeholder="••••••••••••"
              class="w-full" />
            <button type="button" class="eye-btn" (click)="togglePassword()" aria-label="Afficher le mot de passe">
              <i [class]="showPassword() ? 'pi pi-eye-slash' : 'pi pi-eye'"></i>
            </button>
          </div>
        </div>

        <div class="form-options">
          <label class="remember-me">
            <p-checkbox [(ngModel)]="form.rememberMe" name="rememberMe" [binary]="true"></p-checkbox>
            <span>Se souvenir de moi</span>
          </label>
          <a href="#" class="forgot-link">mot de passe oublié</a>
        </div>

        <button type="submit" class="btn-submit" [disabled]="loading()">
          <span *ngIf="!loading()">Se connecter</span>
          <span *ngIf="loading()"><i class="pi pi-spin pi-spinner"></i> Connexion...</span>
        </button>

        <p class="register-link">
          Pas encore de compte ? <a href="#">S'inscrire</a>
        </p>
      </form>
    </div>
  </main>
</div>
