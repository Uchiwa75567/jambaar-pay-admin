<section class="payment-page">
  <article class="payment-card">
    <div class="payment-layout">
      <div class="payment-form-block">
        <div class="section-head">
          <h2>Nouveau paiement</h2>
          <p>Enregistrez rapidement un paiement via le QR fixe lié au numéro téléphone du restaurant.</p>
        </div>

        <div class="payment-grid">
          <label class="field">
            <span>Téléphone du mobile</span>
            <input [(ngModel)]="customerPhone" type="text" placeholder="Ex : 77 123 45 67" />
          </label>

          <label class="field">
            <span>Numero de table</span>
            <input [(ngModel)]="tableNumber" type="text" placeholder="Ex : Table 4" />
          </label>

          <label class="field field-full">
            <span>Montant</span>
            <input [(ngModel)]="amount" type="text" placeholder="Ex : 14 500 FCFA" />
          </label>
        </div>

        <div class="quick-amounts">
          <span>Montants rapides</span>
          <div class="quick-amount-list">
            <button *ngFor="let quickAmount of quickAmounts" type="button" (click)="amount = quickAmount + ' FCFA'">
              {{ quickAmount }} FCFA
            </button>
          </div>
        </div>

        <div class="payment-actions">
          <button type="button" class="secondary-btn secondary-btn-static" disabled>
            QR fixe · {{ qrPhoneNumber() }}
          </button>
          <button type="button" class="primary-btn" [disabled]="submitting() || !isFormValid" (click)="submitPayment()">
            {{ submitting() ? 'Validation...' : 'Valider le paiement' }}
          </button>
        </div>

        <p *ngIf="feedback() as state" class="feedback-message" [class.is-error]="state.type === 'error'">
          {{ state.message }}
        </p>
      </div>

      <aside class="payment-qr-block" aria-label="Code QR du restaurant">
        <div class="payment-qr-frame">
          <img
            [src]="qrCodeUrl()"
            class="payment-qr-code"
            [alt]="'QR code du restaurant pour le numéro ' + qrPhoneNumber()"
          />
        </div>
        <div class="qr-meta">
          <strong>QR fixe téléphone</strong>
          <span>Numéro lié {{ qrPhoneNumber() }}</span>
          <span>La déduplication et l'idempotence se font au moment de la demande de paiement</span>
        </div>
      </aside>
    </div>
  </article>
</section>
