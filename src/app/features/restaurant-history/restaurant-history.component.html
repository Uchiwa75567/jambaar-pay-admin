<section class="restaurant-history-page">
  <div class="history-toolbar">
    <div class="table-search">
      <i class="pi pi-search" aria-hidden="true"></i>
      <input
        pInputText
        type="text"
        placeholder="Rechercher un paiement, un téléphone ou une entreprise"
        [ngModel]="searchTerm()"
        (ngModelChange)="onSearchChange($event)" />
    </div>

    <div class="toolbar-actions">
      <div class="dropdown-wrap">
        <button type="button" class="filter-btn" (click)="toggleFilterMenu()">
          <i class="pi pi-filter" aria-hidden="true"></i>
          <span>{{ statusFilter() }}</span>
        </button>
        <div class="filter-menu" *ngIf="filterMenuOpen()">
          <button
            *ngFor="let status of statusOptions"
            type="button"
            class="filter-item"
            [class.active]="statusFilter() === status"
            (click)="setStatusFilter(status)">
            {{ status }}
          </button>
        </div>
      </div>

      <button type="button" class="export-btn export-excel" (click)="exportExcel()">Exporter Excel</button>
      <button type="button" class="export-btn export-pdf" (click)="exportPdf()">Exporter PDF</button>
    </div>
  </div>

  <section class="history-card">
    <div class="history-card-head">
      <h2>Historique des paiements</h2>
      <span>{{ filteredPayments().length }} transaction(s)</span>
    </div>

    <p-table [value]="paginatedPayments()" styleClass="history-table">
      <ng-template pTemplate="header">
        <tr>
          <th>Référence</th>
          <th>Téléphone</th>
          <th>Entreprise</th>
          <th>Table</th>
          <th>Montant</th>
          <th>Date</th>
          <th>Statut</th>
        </tr>
      </ng-template>

      <ng-template pTemplate="body" let-payment>
        <tr>
          <td data-label="Référence">{{ payment.reference }}</td>
          <td data-label="Téléphone">{{ payment.customerPhone }}</td>
          <td data-label="Entreprise">{{ payment.company }}</td>
          <td data-label="Table">{{ payment.table }}</td>
          <td data-label="Montant">{{ payment.amountLabel }}</td>
          <td data-label="Date">{{ payment.date }}</td>
          <td data-label="Statut">
            <app-status-badge [status]="payment.status"></app-status-badge>
          </td>
        </tr>
      </ng-template>

      <ng-template pTemplate="emptymessage">
        <tr>
          <td colspan="7" class="empty-message">Aucun paiement trouvé.</td>
        </tr>
      </ng-template>
    </p-table>
  </section>

  <div class="history-pagination">
    <div class="dropdown-wrap">
      <button type="button" class="rows-btn" (click)="togglePageSizeMenu()">
        <span>lignes par page</span>
        <strong>{{ pageSize() }}</strong>
        <i class="pi pi-chevron-down" aria-hidden="true"></i>
      </button>
      <div class="rows-menu" *ngIf="pageSizeMenuOpen()">
        <button
          *ngFor="let size of pageSizeOptions"
          type="button"
          class="rows-item"
          [class.active]="pageSize() === size"
          (click)="setPageSize(size)">
          {{ size }}
        </button>
      </div>
    </div>

    <nav class="pager" aria-label="Pagination historique restaurant">
      <button
        type="button"
        class="pager-prev"
        [disabled]="currentPage() === 1"
        (click)="previousPage()">
        Prec
      </button>

      <ng-container *ngFor="let page of visiblePages()">
        <button
          *ngIf="page !== '...'"
          type="button"
          class="page-number"
          [class.active]="currentPage() === page"
          [class.outlined]="currentPage() !== page"
          (click)="setPage(page)">
          {{ page < 10 ? '0' + page : page }}
        </button>
        <span *ngIf="page === '...'" class="page-ellipsis">...</span>
      </ng-container>

      <button
        type="button"
        class="pager-next"
        [disabled]="currentPage() === totalPages()"
        (click)="nextPage()">
        Suiv
      </button>
    </nav>
  </div>
</section>
