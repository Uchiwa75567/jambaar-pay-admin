<div class="panel audit-panel">
  <div class="panel-toolbar">
    <h3 class="panel-title">Journal d'audit</h3>

    <div class="toolbar-right">
      <div class="table-search">
        <i class="pi pi-search"></i>
        <input
          pInputText
          type="text"
          placeholder="Recherchez une entrep...."
          [ngModel]="searchTerm()"
          (ngModelChange)="searchTerm.set($event)" />
      </div>

      <button class="filter-btn" type="button">
        <i class="pi pi-filter"></i>
        <span>{{ statusFilter() }}</span>
      </button>

      <button class="btn-export" type="button">Exporter</button>
    </div>
  </div>

  <p-table [value]="logs()" styleClass="audit-table">
    <ng-template pTemplate="header">
      <tr>
        <th>Action</th>
        <th>Utilisateurs</th>
        <th>details</th>
        <th>Date</th>
      </tr>
    </ng-template>
    <ng-template pTemplate="body" let-log>
      <tr>
        <td>{{ log.action }}</td>
        <td>{{ log.user }}</td>
        <td>{{ log.details }}</td>
        <td>{{ log.date }}</td>
      </tr>
    </ng-template>
    <ng-template pTemplate="emptymessage">
      <tr>
        <td colspan="4" class="empty-message">Aucun journal trouvé.</td>
      </tr>
    </ng-template>
  </p-table>

  <div class="table-footer">
    <button class="rows-btn" type="button">
      <span>lignes par page</span>
      <strong>6</strong>
    </button>
    <nav class="pagination" aria-label="Pagination">
      <span class="prev">Prec</span>
      <span class="page active">01</span>
      <span class="page">02</span>
      <span class="page">03</span>
      <span class="dots">...</span>
      <span class="page outlined">24</span>
      <span class="next">Suiv</span>
    </nav>
  </div>
</div>
