<div class="kpi-card">
  <div class="kpi-top">
    <div class="kpi-icon">
      <img *ngIf="iconSrc" [src]="iconSrc" [alt]="label" class="icon-img" />
      <i *ngIf="!iconSrc" [class]="icon"></i>
    </div>
    <span class="kpi-change">{{ displayChange }}</span>
  </div>
  <div class="kpi-value">
    {{ value }}<span *ngIf="unit" class="kpi-unit"> {{ unit }}</span>
  </div>
  <span class="kpi-label" *ngIf="label">{{ label }}</span>
</div>
