<div class="form-card">
  <h2 class="form-title">Ajouter un restaurant</h2>

  <form (ngSubmit)="onSubmit()" #restaurantForm="ngForm" novalidate>
    <!-- Row 1: Nom du restaurant + Type de cuisine -->
    <div class="form-row two-col">
      <div class="field">
        <label class="field-label">Nom du restaurant <span class="required">*</span></label>
        <input
          pInputText
          type="text"
          class="field-input"
          [(ngModel)]="form.name"
          name="name"
          required
          placeholder="Ex: le Djolof" />
      </div>
      <div class="field">
        <label class="field-label">Type de cuisine <span class="required">*</span></label>
        <p-dropdown
          [options]="cuisineOptions"
          [(ngModel)]="form.cuisineType"
          name="cuisineType"
          placeholder="Selectionner ..."
          styleClass="cuisine-dropdown"
          appendTo="body">
        </p-dropdown>
      </div>
    </div>

    <!-- Row 2: Nom du responsable -->
    <div class="form-row">
      <div class="field">
        <label class="field-label">Nom du responsable<span class="required">*</span></label>
        <input
          pInputText
          type="text"
          class="field-input"
          [(ngModel)]="form.managerName"
          name="managerName"
          required
          placeholder="Mouhamed Ndiaye" />
      </div>
    </div>

    <!-- Row 3: Email + Téléphone -->
    <div class="form-row two-col">
      <div class="field">
        <label class="field-label">Adresse e-mail<span class="required">*</span></label>
        <input
          pInputText
          type="email"
          class="field-input"
          [(ngModel)]="form.email"
          name="email"
          required
          placeholder="ledjolof@gmail.com" />
      </div>
      <div class="field">
        <label class="field-label">Numero de téléphone<span class="required">*</span></label>
        <div class="phone-input">
          <span class="phone-prefix">+221</span>
          <input
            pInputText
            type="tel"
            class="field-input phone-number"
            [(ngModel)]="form.phone"
            name="phone"
            required
            placeholder="78 270 82 39" />
        </div>
      </div>
    </div>

    <!-- Row 4: Ninéa + Solde Initial -->
    <div class="form-row two-col">
      <div class="field">
        <label class="field-label">Ninéa</label>
        <input
          pInputText
          type="text"
          class="field-input"
          [(ngModel)]="form.ninea"
          name="ninea"
          placeholder="0001122" />
      </div>
      <div class="field">
        <label class="field-label">Solde Initial</label>
        <div class="balance-input">
          <input
            pInputText
            type="text"
            class="field-input balance-number"
            [(ngModel)]="form.initialBalance"
            name="initialBalance"
            placeholder="200000" />
          <span class="balance-suffix">Fcfa</span>
        </div>
      </div>
    </div>

    <!-- Row 5: Adresse -->
    <div class="form-row">
      <div class="field">
        <label class="field-label">Adresse</label>
        <input
          pInputText
          type="text"
          class="field-input"
          [(ngModel)]="form.address"
          name="address"
          placeholder="Mermoz VDN" />
      </div>
    </div>

    <!-- Info text + Actions -->
    <p class="info-text">
      Le restaurant recevra un email de bienvenue avec ses identifiants de connexion. Un QR Code unique sera
      généré automatiquement pour le paiement par les clients.
    </p>

    <div class="form-actions">
      <button type="button" class="btn-cancel" (click)="onCancel()">Annuler</button>
      <button type="submit" class="btn-submit">Enrégister l'entreprise</button>
    </div>
  </form>
</div>
