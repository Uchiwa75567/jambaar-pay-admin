<aside class="sidebar">
  <!-- Logo -->
  <div class="sidebar-logo">
    <img src="assets/images/logo-jambaarpay.png" alt="Jambaar Pay" class="logo-img" />
  </div>

  <!-- Navigation -->
  <nav class="sidebar-nav">
    <ng-container *ngFor="let item of navItems">
      <a
        *ngIf="!item.disabled && item.route"
        [routerLink]="item.route"
        routerLinkActive="active"
        class="nav-item"
        [attr.aria-label]="item.label">
        <img [src]="item.iconSrc" [alt]="item.label" class="nav-icon" />
        <span>{{ item.label }}</span>
      </a>

      <button
        *ngIf="item.disabled || !item.route"
        type="button"
        class="nav-item nav-item-disabled"
        [attr.aria-label]="item.label"
        aria-disabled="true">
        <img [src]="item.iconSrc" [alt]="item.label" class="nav-icon" />
        <span>{{ item.label }}</span>
      </button>
    </ng-container>
  </nav>

  <!-- Logout -->
  <div class="sidebar-footer">
    <button class="nav-item logout" (click)="logout()" aria-label="Se déconnecter">
      <img src="assets/icons/icon-logout.svg" alt="" class="nav-icon" />
      <span>Deconnexion</span>
    </button>
  </div>
</aside>
