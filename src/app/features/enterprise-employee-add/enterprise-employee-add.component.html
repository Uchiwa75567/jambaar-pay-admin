<section class="add-employee-panel">
  <form class="employee-form" (ngSubmit)="onSubmit()" novalidate>
    <h2>Ajouter un salari&eacute;</h2>

    <div class="form-grid">
      <label class="field">
        <span>Nom du salari&eacute;<strong>*</strong></span>
        <input type="text" name="name" [(ngModel)]="form.name" [class.input-invalid]="submitted() && !!nameError" placeholder="Ex : Awa Diop" />
        <small class="field-error" *ngIf="submitted() && !!nameError">{{ nameError }}</small>
      </label>

      <label class="field">
        <span>Poste <strong>*</strong></span>
        <input type="text" name="position" [(ngModel)]="form.position" [class.input-invalid]="submitted() && !!positionError" placeholder="Ex : Comptable" />
        <small class="field-error" *ngIf="submitted() && !!positionError">{{ positionError }}</small>
      </label>

      <label class="field">
        <span>Adresse e-mail<strong>*</strong></span>
        <input type="email" name="email" [(ngModel)]="form.email" [class.input-invalid]="submitted() && !!emailError" placeholder="Ex : awa.diop@entreprise.sn" />
        <small class="field-error" *ngIf="submitted() && !!emailError">{{ emailError }}</small>
      </label>

      <label class="field">
        <span>Numero de t&eacute;l&eacute;phone<strong>*</strong></span>
        <input type="tel" name="phone" [(ngModel)]="form.phone" [class.input-invalid]="submitted() && !!phoneError" placeholder="Ex : 77 123 45 67" />
        <small class="field-error" *ngIf="submitted() && !!phoneError">{{ phoneError }}</small>
      </label>

      <label class="field">
        <span>Adresse</span>
        <input type="text" name="address" [(ngModel)]="form.address" [class.input-invalid]="submitted() && !!addressError" placeholder="Ex : Liberte 6, Dakar" />
        <small class="field-error" *ngIf="submitted() && !!addressError">{{ addressError }}</small>
      </label>

      <label class="field">
        <span>montant initiale</span>
        <input type="text" name="initialAmount" [(ngModel)]="form.initialAmount" [class.input-invalid]="submitted() && !!initialAmountError" placeholder="Ex : 25000" />
        <small class="field-error" *ngIf="submitted() && !!initialAmountError">{{ initialAmountError }}</small>
      </label>
    </div>

    <p class="helper-text">
      Un email avec les identifiants de connexion sera automatiquement envoy&eacute; au salari&eacute; apr&egrave;s
      l'enregistrement.
    </p>

    <div class="form-actions">
      <a routerLink="/enterprise-employees" class="btn btn-cancel">Annuler</a>
      <button type="submit" class="btn btn-save">Enr&eacute;gister le salari&eacute;</button>
    </div>
  </form>
</section>
