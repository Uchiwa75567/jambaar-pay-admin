<section class="companies-card">
  <div class="companies-toolbar">
    <h2>Liste des Entreprises</h2>

    <div class="toolbar-actions">
      <div class="table-search">
        <i class="pi pi-search"></i>
        <input
          pInputText
          type="text"
          placeholder="Recherchez une entrep...."
          [ngModel]="searchTerm()"
          (ngModelChange)="searchTerm.set($event)" />
      </div>

      <button class="filter-btn" type="button">
        <i class="pi pi-filter"></i>
        <span>{{ statusFilter() }}</span>
      </button>

      <button class="btn-add" type="button">Ajouter une entreprise</button>
    </div>
  </div>

  <p-table [value]="companies()" styleClass="companies-table">
    <ng-template pTemplate="header">
      <tr>
        <th>Entreprises</th>
        <th>Salariés</th>
        <th>Solde Total</th>
        <th>Date d’inscription</th>
        <th>Statut</th>
        <th>Action</th>
      </tr>
    </ng-template>
    <ng-template pTemplate="body" let-company>
      <tr>
        <td>{{ company.name }}</td>
        <td>{{ company.employeeCount | number }}</td>
        <td>{{ company.totalBalance | number }}</td>
        <td>{{ company.registrationDate }}</td>
        <td><app-status-badge [status]="company.status"></app-status-badge></td>
        <td>
          <button class="action-btn" (click)="actionMenu.toggle($event)" aria-label="Actions entreprise">
            <i class="pi pi-ellipsis-v"></i>
          </button>
          <p-menu #actionMenu [popup]="true" [model]="getMenuItems(company)" appendTo="body"></p-menu>
        </td>
      </tr>
    </ng-template>
    <ng-template pTemplate="emptymessage">
      <tr>
        <td colspan="6" class="empty-message">Aucune entreprise trouvée.</td>
      </tr>
    </ng-template>
  </p-table>

  <div class="table-footer">
    <button class="rows-btn" type="button">
      <span>lignes par page</span>
      <strong>6</strong>
    </button>

    <nav class="pagination" aria-label="Pagination">
      <span class="prev disabled">Prec</span>
      <span class="page active">01</span>
      <span class="page">02</span>
      <span class="page">03</span>
      <span class="dots">...</span>
      <span class="page outlined">24</span>
      <span class="next">Suiv</span>
    </nav>
  </div>
</section>
