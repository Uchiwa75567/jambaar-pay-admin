<header class="topbar">
  <div class="title-block">
    <h1 class="page-title">{{ pageTitle }}</h1>
    <p class="page-subtitle" *ngIf="pageSubtitle">{{ pageSubtitle }}</p>
  </div>

  <div class="search-box">
    <img src="assets/icons/icon-search.svg" alt="" class="search-icon" aria-hidden="true" />
    <input type="text" placeholder="Recherchez ..." aria-label="Rechercher dans l'application" />
  </div>

  <div class="topbar-right">
    <a routerLink="/settings" routerLinkActive="settings-active" class="icon-btn" aria-label="Paramètres du système">
      <img src="assets/icons/icon-settings.svg" alt="" class="settings-icon" aria-hidden="true" />
    </a>

    <div class="avatar-block">
      <div class="user-info">
        <span class="user-name">{{ profile?.name ?? 'Admin' }}</span>
        <span class="user-role">{{ profile?.role }}</span>
      </div>
      <img
        src="assets/images/avatar-admin.png"
        [alt]="profile?.name ?? 'Admin'"
        class="avatar-photo"
      />
    </div>
  </div>
</header>
