<section class="companies-card">
  <div class="companies-toolbar">
    <h2>Liste des Entreprises</h2>

    <div class="toolbar-actions">
      <div class="table-search">
        <i class="pi pi-search"></i>
        <input pInputText type="text" placeholder="Recherchez une entrep...."
          [ngModel]="searchTerm()" (ngModelChange)="searchTerm.set($event)" />
      </div>

      <!-- Filter dropdown -->
      <div class="dropdown-wrap">
        <button class="filter-btn" type="button" (click)="toggleFilterMenu()">
          <i class="pi pi-filter"></i>
          <span>{{ filterLabel }}</span>
        </button>
        <div class="filter-menu" *ngIf="filterMenuOpen()">
          <p class="filter-group-label">Statut</p>
          <button *ngFor="let s of statusOptions" class="filter-item"
            [class.active]="statusFilter() === s"
            type="button" (click)="setStatusFilter(s)">{{ s }}</button>
          <p class="filter-group-label">Période</p>
          <button *ngFor="let d of dateOptions" class="filter-item"
            [class.active]="dateFilter() === d"
            type="button" (click)="setDateFilter(d)">{{ d }}</button>
        </div>
      </div>

      <button class="btn-add" type="button" routerLink="/companies/add">Ajouter une entreprise</button>
    </div>
  </div>

  <p-table [value]="companies()" styleClass="companies-table">
    <ng-template pTemplate="header">
      <tr>
        <th>Entreprises</th>
        <th>Salariés</th>
        <th>Solde Total</th>
        <th>Date d'inscription</th>
        <th>Statut</th>
        <th>Action</th>
      </tr>
    </ng-template>
    <ng-template pTemplate="body" let-company>
      <tr>
        <td data-label="Entreprise">{{ company.name }}</td>
        <td data-label="Salariés">{{ company.employeeCount | number }}</td>
        <td data-label="Solde Total">{{ company.totalBalance | number }}</td>
        <td data-label="Date d'inscription">{{ company.registrationDate }}</td>
        <td data-label="Statut"><app-status-badge [status]="company.status"></app-status-badge></td>
        <td data-label="Action">
          <button class="action-btn" (click)="actionMenu.toggle($event)" aria-label="Actions entreprise">
            <i class="pi pi-ellipsis-v"></i>
          </button>
          <p-menu #actionMenu [popup]="true" [model]="getMenuItems(company)" appendTo="body"></p-menu>
        </td>
      </tr>
    </ng-template>
    <ng-template pTemplate="emptymessage">
      <tr><td colspan="6" class="empty-message">Aucune entreprise trouvée.</td></tr>
    </ng-template>
  </p-table>

  <div class="table-footer">
    <!-- Rows per page -->
    <div class="dropdown-wrap">
      <button class="rows-btn" type="button" (click)="togglePageSizeMenu()">
        <span>lignes par page</span>
        <strong>{{ pageSize() }}</strong>
        <i class="pi pi-chevron-down" style="font-size:11px"></i>
      </button>
      <div class="rows-menu" *ngIf="pageSizeMenuOpen()">
        <button *ngFor="let s of pageSizeOptions" class="rows-item"
          [class.active]="pageSize() === s"
          type="button" (click)="setPageSize(s)">{{ s }}</button>
      </div>
    </div>

    <!-- Pagination -->
    <nav class="pagination" aria-label="Pagination">
      <span class="prev" [class.disabled]="currentPage() === 1" (click)="prevPage()">Prec</span>
      <ng-container *ngFor="let p of visiblePages()">
        <span *ngIf="p !== '...'" class="page"
          [class.active]="currentPage() === p"
          [class.outlined]="currentPage() !== p"
          (click)="setPage(p)">{{ p < 10 ? '0' + p : p }}</span>
        <span *ngIf="p === '...'" class="dots">...</span>
      </ng-container>
      <span class="next" [class.disabled]="currentPage() === totalPages()" (click)="nextPage()">Suiv</span>
    </nav>
  </div>
</section>
